name: PR68 Vulkan baseline diagnostic
on:
  push:
    branches: [ao/mechanic-6/ci-vulkan-baseline]
permissions:
  contents: read
jobs:
  compare:
    name: focused-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 3523e987c7ec672562210da77e4388213e2dd01d
          - label: candidate
            revision: 24bd9a0a3d2db275bb5e81a2fb9906f1bc3bc386
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MOSAIC_DEPLOY_KEY }}
      - name: Trust gitlab.com
        shell: bash
        run: mkdir -p ~/.ssh && ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
      - run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Equivalent Linux Vulkan provisioning
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers=25.2.8-0ubuntu0.24.04.4 vulkan-tools=1.3.275.0+dfsg1-1
          shopt -s nullglob
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1
          export VK_DRIVER_FILES="${drivers[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vulkan-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          vulkaninfo --summary | tee adapter.txt
          grep -F 'llvmpipe (LLVM 20.1.2, 256 bits)' adapter.txt
      - name: Record exact provenance
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short
          rustc -Vv
          cargo -V
          uname -a
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          dpkg-query -W libvulkan1 mesa-vulkan-drivers vulkan-tools
          sha256sum Cargo.lock rust-toolchain.toml
      - name: Focused failing tests with unchanged assertions
        shell: bash
        run: |
          set -o pipefail
          cargo xtask test --locked --exclude mechanic-core --exclude mechanic-world --exclude mechanic-physics --exclude mechanic-bench --exclude bevy_mosaic --exclude xtask -- --exact --nocapture device::terrain::generated::generated_caves_stop_wall_and_ceiling_impacts device::tests::contacts::dense_pipe_contacts_on_bearings_and_a_rail_remain_bounded device::tests::contacts::gpu_cylinder_bore_is_passable_and_annular_material_blocks_motion device::tests::contacts::gpu_pipe_bend_bore_is_passable_and_annular_material_blocks_motion device::tests::contacts::lower_modulus_allows_more_transient_penetration_without_failure device::tests::contacts::plastic_rebounds_more_than_concrete device::tests::contacts::static_friction_holds_a_sub_threshold_load_while_kinetic_friction_slows_sliding device::tests::pendulums::tall_single_and_double_pendulums_dissipate_energy device::tests::vehicles::articulated_car_drop_settles_without_drift_or_ground_penetration device::tests::vehicles::articulated_car_wall_impact_remains_bounded_and_decays device::tests::vehicles::production_servos_hold_steering_under_first_gear_gas_drive device::tests::vehicles::struck_articulated_wheel_recovers_without_crossing_ground showcase::tests::dynamic_presets_do_not_gain_unbounded_spin 2>&1 | tee focused-tests.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr68-vulkan-${{ matrix.label }}
          path: |
            adapter.txt
            focused-tests.log
