name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Mosaic is a private first-party dependency fetched over SSH. The secret
      # is a read-only deploy key for gitlab.com/unincorporated/mosaic/mosaic.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MOSAIC_DEPLOY_KEY }}
      - name: Trust gitlab.com
        shell: bash
        run: mkdir -p ~/.ssh && ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
      - run: rustup show
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Linux software Vulkan adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          # Hosted Linux runners have no display GPU. Exercise the real Vulkan
          # backend with lavapipe, including tests that require an adapter.
          shopt -s nullglob
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1
          export VK_DRIVER_FILES="${drivers[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vulkan-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          vulkaninfo --summary
      - run: cargo xtask ci
      - name: Fence acquisition and concurrent queue regression
        run: cargo test --manifest-path vendor/wgpu-core/Cargo.toml --features noop,wgsl --config 'patch.crates-io.wgpu-hal.path="vendor/wgpu-hal"' acquisition_does_not_block
      - name: Fence regression with lock validation
        env:
          RUSTFLAGS: --cfg wgpu_validate_locks
        run: cargo test --manifest-path vendor/wgpu-core/Cargo.toml --features noop,wgsl --config 'patch.crates-io.wgpu-hal.path="vendor/wgpu-hal"' acquisition_does_not_block
