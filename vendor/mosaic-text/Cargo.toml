[package]
name = "mosaic-text"
description = "Text shaping and glyph rasterization for Mosaic (built on cosmic-text)."
version = "0.28.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Jens <jens4173@gmail.com>"]

[dependencies]
mosaic-core = { version = "0.28.1", git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "0e6e7b55d827bbacd94c0e1a54cb43fe714e9b5c" }
mosaic-render = { version = "0.28.1", git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "0e6e7b55d827bbacd94c0e1a54cb43fe714e9b5c" }
cosmic-text = "0.19.0"
unicode-segmentation = "1.13.3"

# The criterion suites own `cargo bench`; without this the lib's own libtest
# harness also registers as a bench target and rejects criterion's flags.
[lib]
bench = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "text"
harness = false
