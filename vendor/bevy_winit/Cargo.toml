[package]
name = "bevy_winit"
version = "0.19.0"
edition = "2024"
description = "A winit window and input backend for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["x11"]
trace = []
wayland = ["winit/wayland", "winit/wayland-csd-adwaita"]
x11 = ["winit/x11"]
accesskit_unix = [
  "accesskit_winit/accesskit_unix",
  "accesskit_winit/async-io",
  "bevy_tasks/async-io",
]

serialize = [
  "bevy_input/serialize",
  "bevy_window/serialize",
  "bevy_platform/serialize",
]
android-native-activity = ["winit/android-native-activity"]
android-game-activity = ["winit/android-game-activity"]
custom_cursor = [
  "bevy_window/custom_cursor",
  "bevy_image",
  "bevy_asset",
  "wgpu-types",
  "bytemuck",
]

[dependencies]
# bevy
bevy_a11y = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_app = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_derive = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_input = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_input_focus = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_log = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_reflect = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_window = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_tasks = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0" }
bevy_platform = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", default-features = false, features = [
  "std",
] }

# bevy optional
## used by custom_cursor
bevy_asset = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", optional = true }
## used by custom_cursor
bevy_image = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", optional = true }
## used by custom_cursor
wgpu-types = { version = "29.0.3", optional = true }
## used by custom_cursor
bytemuck = { version = "1.5", optional = true }

# other
# feature rwh_06 refers to window_raw_handle@v0.6
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
accesskit_winit = { version = "0.32", default-features = false, features = [
  "rwh_06",
] }
approx = { version = "0.5", default-features = false }
accesskit = "0.24"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy_android = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = "0.3"
js-sys = "0.3"
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
bevy_app = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", default-features = false, features = [
  "web",
] }
bevy_platform = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", default-features = false, features = [
  "web",
] }
bevy_reflect = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", version = "0.19.0", default-features = false, features = [
  "web",
] }


[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
