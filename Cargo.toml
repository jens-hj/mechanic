[workspace]
members = [
    "crates/bevy_mosaic",
    "crates/mechanic-core",
    "crates/mechanic-world",
    "crates/mechanic-gpu",
    "crates/mechanic-bench",
    "crates/mechanic-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false, features = ["std", "serialize"] }
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"
wgpu = "29.0"
pollster = "0.4"
naga = { version = "29.0", features = ["wgsl-in"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
fastnoise-lite = { version = "1.1.1", features = ["f64"] }
getrandom = "0.3"

# Mosaic is pinned to the first upstream revision containing the external-device
# renderer used by `bevy_mosaic`. Keep every crate on the same revision.
mosaic-core = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-layout = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-macros = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-render = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-render-wgpu = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-text = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }
mosaic-widgets = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", rev = "ae4923ab76ea17ce8a9a27e2054ae642f70dae00" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Release-equivalent build with symbols for Instruments Time Profiler and
# Metal System Trace captures. Optimizer and code-generation settings inherit
# the real release profile.
[profile.profiling]
inherits = "release"
debug = 1
