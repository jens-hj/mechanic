[workspace]
members = [
    "crates/mechanic-core",
    "crates/mechanic-gpu",
    "crates/mechanic-bench",
    "crates/mechanic-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false, features = ["std"] }
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"
wgpu = "29.0"
pollster = "0.4"
naga = { version = "29.0", features = ["wgsl-in"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
