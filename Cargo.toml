[workspace]
members = [
    "crates/bevy_mosaic",
    "crates/mechanic-core",
    "crates/mechanic-gpu",
    "crates/mechanic-bench",
    "crates/mechanic-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false }
bevy_math = { git = "https://github.com/bevyengine/bevy.git", tag = "v0.19.0", default-features = false, features = ["std"] }
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"
wgpu = "29.0"
pollster = "0.4"
naga = { version = "29.0", features = ["wgsl-in"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"

# Mosaic, the GUI framework the editor UI is moving onto. Pinned to a release
# tag; the `[patch]` below points every one of these at the local checkout
# while the embedding API (`WgpuRenderer::from_device` / `encode_into`) is
# still unreleased. Drop the patch once a release carries it.
mosaic-core = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-layout = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-macros = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-render = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-render-wgpu = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-text = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }
mosaic-widgets = { git = "ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git", tag = "v0.28.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Local development against the mosaic working tree. Machine-specific by
# nature: it is what lets a change land in mosaic and be used here in the same
# breath. Remove it — and move the tag above — once mosaic releases the
# embedding API.
[patch."ssh://git@gitlab.com/unincorporated/mosaic/mosaic.git"]
mosaic-core = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-core" }
mosaic-layout = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-layout" }
mosaic-macros = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-macros" }
mosaic-render = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-render" }
mosaic-render-wgpu = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-render-wgpu" }
mosaic-text = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-text" }
mosaic-widgets = { path = "/Users/jens/repos/mosaic/mosaic/crates/mosaic-widgets" }
